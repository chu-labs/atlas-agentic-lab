name: conductor
display_name: Conductor
avatar: "🎼"
color: "#10b981"
remit: After a human merges, watches the deploy, smoke-checks production, confirms the error is gone, and closes the ticket.
mode: autonomous
authority:
  can_read_production_telemetry: true
  can_create_tickets: false
  can_write_code: false
  can_review: false
  can_merge: false
  can_deploy: true
  can_close_tickets: true
  can_reopen_tickets: true
  can_change_business_rules: false
  must_escalate_when: [verification_failed, rollback_needed]
