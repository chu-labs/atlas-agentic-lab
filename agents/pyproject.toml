[project]
name = "atlas-agents"
version = "0.1.0"
description = "The ATLAS agent fleet: Scout, Forge, Sentinel, Conductor, Watchtower"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35",
  "httpx>=0.27",
  "anthropic>=0.40",
  "pyyaml>=6",
  "pyjwt[crypto]>=2.8",
  "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_agents"]

[tool.ruff]
line-length = 110
target-version = "py312"
