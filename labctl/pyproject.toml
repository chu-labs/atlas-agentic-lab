[project]
name = "labctl"
version = "0.1.0"
description = "Demo control CLI for the ATLAS Agentic SDLC Demo Lab"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35",
  "click>=8.1",
  "rich>=13",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pyjwt[crypto]>=2.8",
  "pyyaml>=6.0.3",
]

[project.scripts]
labctl = "labctl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labctl"]
