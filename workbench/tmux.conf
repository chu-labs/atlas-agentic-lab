# ATLAS Workbench: tuned for a projector. Load with `tmux -f workbench/tmux.conf` (labctl workbench does this).
set -g default-terminal "tmux-256color"
set -g mouse on
set -g history-limit 20000
set -g base-index 0
set -g escape-time 0
set -g focus-events on

# Panes: borders on, titles on top, thick and coloured per agent (colours are set per pane by atlas-team).
set -g pane-border-status top
set -g pane-border-format " #{pane_title} "
set -g pane-border-lines heavy
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour255,bold

# Status bar: session, agent count, ticket, elapsed.
set -g status on
set -g status-position bottom
set -g status-interval 1
set -g status-style bg=colour234,fg=colour252
set -g status-left-length 40
set -g status-right-length 90
set -g status-left "#[bg=colour39,fg=colour16,bold]  #S  #[default] "
set -g status-right "#[fg=colour214,bold] agents #{@atlas_agents} #[default]│#[fg=colour84,bold] #{@atlas_ticket} #[default]│ #(cat ~/.config/atlas-lab/workbench/elapsed 2>/dev/null) │ %H:%M:%S "
set -g window-status-format ""
set -g window-status-current-format ""
set -g @atlas_agents 0
set -g @atlas_ticket "—"

# Keep the left main pane large.
set -g main-pane-width 52%
