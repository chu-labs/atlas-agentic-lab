[project]
name = "atlas-team"
version = "0.1.0"
description = "Workbench: spawn real Claude Code teammates into tmux panes on git worktrees"
requires-python = ">=3.12"
dependencies = ["mcp>=1.2,<2", "boto3>=1.35", "httpx>=0.27"]

[project.scripts]
atlas-team = "atlas_team.server:main"
atlas-team-render = "atlas_team.render:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_team"]
